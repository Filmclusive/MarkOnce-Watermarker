[package]
name = "local-watermarker"
version = "0.1.0"
description = "Local one-time-use watermarked document exporter"
authors = ["Local Watermarker"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
base64 = "=0.22.1"
mime_guess = "=2.0.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
tauri = { version = "=2.11.2", features = [] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "=2.5.4"
time = { version = "=0.3.47", features = ["formatting"] }
uuid = { version = "=1.23.2", features = ["v4"] }
